<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Classic Beef Stew | Hearth &amp; Home</title>
<meta property="og:site_name" content="Hearth &amp; Home">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Recipe",
  "name": "Classic Beef Stew",
  "author": "Hearth & Home Test Kitchen",
  "image": { "@type": "ImageObject", "url": "https://hearthhome.test/img/beef-stew.jpg" },
  "prepTime": "PT20M",
  "cookTime": "PT2H30M",
  "recipeYield": 6,
  "recipeIngredient": [
    "2 lbs beef chuck, cut into 1-inch cubes",
    "3 carrots, chopped",
    "3-4 potatoes, cubed",
    "1 onion, diced",
    "4 cups beef broth",
    "2 tbsp tomato paste",
    "1/2 tsp thyme"
  ],
  "recipeInstructions": [
    { "@type": "HowToStep", "text": "Sear beef cubes in batches over high heat until browned on all sides." },
    { "@type": "HowToStep", "text": "Add onion and cook until softened, about 5 minutes." },
    { "@type": "HowToStep", "text": "Stir in tomato paste, then add broth, carrots, potatoes, and thyme." },
    { "@type": "HowToStep", "text": "Cover and simmer on low for 2 hours, until beef is fork-tender." }
  ]
}
</script>
</head>
<body>
<h1>Classic Beef Stew</h1>
</body>
